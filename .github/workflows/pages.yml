name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Desde el 25-10-2026 la web está en https://cosascucas.es (Arsys). Aquí solo se publican
      # páginas que llevan a la misma dirección allí, para no tener la web duplicada en Google:
      # una por cada página de la web (misma lista que construir-web.sh) y un 404.html que lleva
      # cualquier otra dirección (fotos, carpetas, enlaces viejos) a la misma ruta en cosascucas.es.
      - name: Build _site (redirecciones a cosascucas.es)
        shell: bash
        run: |
          set -euo pipefail
          bash herramientas/construir-web.sh _site
          cd _site
          find . -mindepth 1 -maxdepth 1 ! -name '*.html' -exec rm -rf {} +
          rm -f google*.html
          for f in *.html; do
            n="${f%.html}"
            case "$n" in
              404) continue ;;
              index) u="https://cosascucas.es/" ;;
              *) u="https://cosascucas.es/$n" ;;
            esac
            printf '%s\n' '<!doctype html>' '<html lang="es"><head><meta charset="utf-8">' \
              '<title>Cosas Cucas</title>' \
              "<link rel=\"canonical\" href=\"$u\">" \
              "<script>location.replace('$u'+location.search+location.hash)</script>" \
              "<meta http-equiv=\"refresh\" content=\"0; url=$u\">" \
              "</head><body><p>La web de Cosas Cucas est&aacute; en <a href=\"$u\">cosascucas.es</a>.</p></body></html>" > "$f"
          done
          printf '%s\n' '<!doctype html>' '<html lang="es"><head><meta charset="utf-8">' \
            '<title>Cosas Cucas</title>' \
            '<script>location.replace("https://cosascucas.es"+location.pathname.replace(/^\/cosas-cucas(?=\/|$)/,"").replace(/\.html$/,"").replace(/\/index$/,"/")+location.search+location.hash)</script>' \
            '<meta http-equiv="refresh" content="0; url=https://cosascucas.es/">' \
            '</head><body><p>La web de Cosas Cucas est&aacute; en <a href="https://cosascucas.es/">cosascucas.es</a>.</p></body></html>' > 404.html
          ls -la

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
