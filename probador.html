<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Probador Virtual · Cosas Cucas | Indumentaria Valenciana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
  :root {
    --bg:         #F4EDD8;
    --bg-alt:     #EDE5CE;
    --bg-dark:    #1A1714;
    --gold:       #B5903A;
    --gold-light: #D4B166;
    --text:       #1A1714;
    --muted:      #6B5D4F;
    --border:     #D9CEB4;
    --white:      #FDFAF3;
    --font-body:  'Space Grotesk', sans-serif;
    --font-disp:  'Playfair Display', serif;
    --radius:     3px;
    /* Colores del traje — el SVG los lee directamente via fill:var(...) */
    --c-falda:   #1B3A8A;
    --c-corpino: #922020;
    --c-zapatos: #3D2010;
    --c-flores:  #D4388A;
    --c-manton:  #C4A820;
    --c-aderezo: #B5903A;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }

  /* ── HEADER ─────────────────────────────── */
  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 52px; flex-shrink: 0;
    background: var(--bg-dark);
    border-bottom: 1px solid rgba(217,206,180,.15); gap: 12px;
  }
  .hdr-left { display: flex; align-items: center; gap: 14px; }
  .hdr-brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .hdr-brand img { height: 30px; width: auto; object-fit: contain; }
  .hdr-brand-name { font-size:.68rem; font-weight:700; letter-spacing:.18em;
    text-transform:uppercase; color:var(--gold-light); white-space:nowrap; }
  .hdr-sep { width:1px; height:22px; background:rgba(217,206,180,.2); }
  .hdr-title { font-family:var(--font-disp); font-size:.95rem; font-style:italic;
    color:rgba(253,250,243,.7); white-space:nowrap; }
  .hdr-badge { font-size:.58rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    background:var(--gold); color:var(--white); padding:3px 8px; border-radius:2px; }
  .hdr-back { font-size:.65rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:rgba(253,250,243,.5); text-decoration:none; display:flex; align-items:center; gap:5px;
    transition:color .2s; white-space:nowrap; }
  .hdr-back:hover { color:var(--gold-light); }

  /* ── LAYOUT 3 COLUMNAS ───────────────────── */
  #main {
    flex: 1; display: grid;
    grid-template-columns: 164px 1fr 252px;
    overflow: hidden; min-height: 0;
  }

  /* ── PANEL IZQUIERDO ─────────────────────── */
  #parts-panel {
    background: var(--white); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .pp-section { padding: 14px 12px 0; border-bottom: 1px solid var(--border); }
  .pp-section:last-child { border-bottom: none; padding-bottom: 14px; }
  .pp-label { font-size:.58rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold); display:block; margin-bottom:10px; }

  .part-btn {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 9px 8px; margin-bottom: 5px;
    background: transparent; border: 1px solid transparent;
    border-radius: var(--radius); cursor: pointer; transition: all .18s; text-align: left;
  }
  .part-btn:hover { background: var(--bg-alt); border-color: var(--border); }
  .part-btn.active { background: var(--bg); border-color: var(--gold); }
  .part-btn.active .pb-name { color: var(--gold); font-weight: 700; }
  .part-color-dot { width:20px; height:20px; border-radius:50%; flex-shrink:0;
    border:2px solid rgba(0,0,0,.12); transition:background .4s; }
  .pb-name { font-size:.72rem; font-weight:600; color:var(--text); }
  .pb-sub  { font-size:.58rem; color:var(--muted); }

  .comp-btn {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 8px 8px; margin-bottom: 6px;
    background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; transition: all .18s; text-align: left;
  }
  .comp-btn:hover { border-color: var(--gold-light); }
  .comp-btn.on { border-color: var(--gold); background: var(--bg); }
  .toggle-pill { width:28px; height:16px; border-radius:8px; background:var(--border);
    position:relative; flex-shrink:0; transition:background .2s; }
  .toggle-pill::after { content:''; position:absolute; top:2px; left:2px; width:12px; height:12px;
    border-radius:50%; background:white; transition:transform .2s; }
  .comp-btn.on .toggle-pill { background:var(--gold); }
  .comp-btn.on .toggle-pill::after { transform:translateX(12px); }
  .cb-name { font-size:.7rem; font-weight:600; color:var(--text); }

  .action-btn {
    display:block; width:100%; padding:9px 8px; font-family:var(--font-body);
    font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    text-align:center; border-radius:var(--radius); cursor:pointer;
    transition:all .2s; margin-bottom:7px; text-decoration:none;
  }
  .btn-gold    { background:var(--gold); color:var(--white); border:none; }
  .btn-gold:hover { background:var(--gold-light); }
  .btn-outline { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-outline:hover { border-color:var(--gold); color:var(--gold); }

  /* ── CENTRO: modelo SVG ──────────────────── */
  #model-wrap {
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; background:var(--bg-alt); position:relative; padding:10px;
  }
  #model-svg {
    height:100%; max-height:calc(100vh - 52px);
    width:auto; max-width:100%;
    filter:drop-shadow(0 8px 32px rgba(26,23,20,.18));
  }
  .part-group { cursor:pointer; transition:filter .25s; }
  .part-group:hover { filter:drop-shadow(0 0 6px rgba(181,144,58,.55)); }
  .part-group.sel   { filter:drop-shadow(0 0 10px rgba(181,144,58,.8)); }

  #model-hint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(26,23,20,.8); color:rgba(253,250,243,.85);
    font-size:.62rem; letter-spacing:.08em; padding:6px 16px; border-radius:20px;
    pointer-events:none; white-space:nowrap; transition:opacity .5s;
  }

  /* ── PANEL DERECHO: Telas ────────────────── */
  #telas-panel {
    background:var(--white); border-left:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #telas-head { padding:14px 14px 10px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .tp-eyebrow { font-size:.58rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold); display:block; margin-bottom:4px; }
  .tp-title { font-family:var(--font-disp); font-size:1rem; font-style:italic; }
  .tp-sub   { font-size:.65rem; color:var(--muted); margin-top:3px; }
  #tp-active-part { font-weight:700; color:var(--gold); }

  .tp-filters { display:flex; gap:4px; flex-wrap:wrap;
    padding:10px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .tp-filter {
    font-size:.57rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    padding:3px 9px; border-radius:20px; border:1px solid var(--border);
    background:transparent; color:var(--muted); cursor:pointer; transition:all .18s;
  }
  .tp-filter.active, .tp-filter:hover { background:var(--gold); border-color:var(--gold); color:var(--white); }

  #telas-grid {
    flex:1; overflow-y:auto;
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px; padding:12px; align-content:start;
  }
  .tela-card {
    cursor:pointer; border-radius:var(--radius); border:2px solid transparent;
    overflow:hidden; transition:border-color .18s, transform .18s;
  }
  .tela-card:hover { border-color:var(--gold-light); transform:translateY(-1px); }
  .tela-card.sel   { border-color:var(--gold); }

  .tela-swatch { width:100%; aspect-ratio:1; position:relative; overflow:hidden; }
  .tela-card[data-tipo="Seda"]       .tela-swatch { background-image:linear-gradient(135deg,rgba(255,255,255,.38) 0%,transparent 45%,rgba(0,0,0,.08) 100%); }
  .tela-card[data-tipo="Terciopelo"] .tela-swatch { background-image:linear-gradient(135deg,rgba(0,0,0,.18) 0%,rgba(255,255,255,.06) 45%,rgba(0,0,0,.22) 100%); }
  .tela-card[data-tipo="Tafetán"]    .tela-swatch { background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 1px,transparent 1px,transparent 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 1px,transparent 1px,transparent 3px),linear-gradient(135deg,rgba(255,255,255,.22) 0%,transparent 60%); }
  .tela-card[data-tipo="Raso"]       .tela-swatch { background-image:linear-gradient(120deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.48) 38%,rgba(255,255,255,.1) 52%,rgba(0,0,0,.07) 72%,rgba(255,255,255,.18) 100%); }

  .tela-check {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(181,144,58,.35); opacity:0; transition:opacity .18s;
  }
  .tela-card.sel .tela-check { opacity:1; }
  .tela-name { font-size:.56rem; font-weight:600; color:var(--text);
    padding:4px 5px 2px; background:var(--white); line-height:1.2; }
  .tela-tipo { font-size:.5rem; color:var(--muted); padding:0 5px 4px; background:var(--white); }
  .tela-card.sel .tela-name { color:var(--gold); }

  /* ── RESPONSIVE ─────────────────────────── */
  @media (max-width:900px) {
    html,body { overflow:auto; }
    #main { grid-template-columns:1fr; overflow:visible; }
    #parts-panel,#telas-panel { border:none; border-bottom:1px solid var(--border); }
    #model-wrap { height:500px; }
    #telas-grid { grid-template-columns:repeat(4,1fr); }
  }
  </style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div class="hdr-left">
    <a class="hdr-brand" href="/">
      <img src="logo cosascucas.png" alt="Cosas Cucas">
      <span class="hdr-brand-name">Cosas Cucas</span>
    </a>
    <div class="hdr-sep"></div>
    <span class="hdr-title">Probador de Telas</span>
    <span class="hdr-badge">Nuevo</span>
  </div>
  <a class="hdr-back" href="/">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Volver a la web
  </a>
</header>

<main id="main">

  <!-- ══ IZQUIERDA: Selector de parte ══ -->
  <aside id="parts-panel">

    <div class="pp-section">
      <span class="pp-label">① Parte del traje</span>

      <button class="part-btn active" data-part="falda" onclick="selectPart('falda')">
        <div class="part-color-dot" id="dot-falda"></div>
        <div><div class="pb-name">Falda</div><div class="pb-sub">Falda principal</div></div>
      </button>

      <button class="part-btn" data-part="corpino" onclick="selectPart('corpino')">
        <div class="part-color-dot" id="dot-corpino"></div>
        <div><div class="pb-name">Corpiño</div><div class="pb-sub">Cuerpo y mangas</div></div>
      </button>

      <button class="part-btn" data-part="zapatos" onclick="selectPart('zapatos')">
        <div class="part-color-dot" id="dot-zapatos"></div>
        <div><div class="pb-name">Zapatos</div><div class="pb-sub">Calzado</div></div>
      </button>
    </div>

    <div class="pp-section">
      <span class="pp-label">② Añadir complementos</span>

      <button class="comp-btn" id="comp-flores" onclick="toggleComplement('flores')">
        <div class="toggle-pill"></div>
        <div><div class="cb-name">🌸 Flores</div></div>
      </button>

      <button class="comp-btn" id="comp-manton" onclick="toggleComplement('manton')">
        <div class="toggle-pill"></div>
        <div><div class="cb-name">🧣 Mantón</div></div>
      </button>

      <button class="comp-btn" id="comp-aderezo" onclick="toggleComplement('aderezo')">
        <div class="toggle-pill"></div>
        <div><div class="cb-name">✨ Aderezo</div></div>
      </button>

      <button class="comp-btn" id="comp-peineta" onclick="toggleComplement('peineta')">
        <div class="toggle-pill"></div>
        <div><div class="cb-name">👑 Peineta</div></div>
      </button>
    </div>

    <div class="pp-section" style="padding-bottom:14px; margin-top:auto;">
      <span class="pp-label">③ Guardar</span>
      <button class="action-btn btn-gold" onclick="downloadPNG()">⬇ Descargar</button>
      <a class="action-btn btn-outline" id="btn-pedir"
         href="mailto:info@cosascucas.es?subject=Consulta%20diseño%20traje">
        ✉ Pedir este diseño
      </a>
    </div>

  </aside>

  <!-- ══ CENTRO: Modelo SVG ══ -->

      <!-- sombra suelo -->

        <!-- pliegues oscuros laterales -->

        <!-- puntilla inferior -->

      </g>

      <!-- ══ CORPIÑO + MANGAS ══ -->

      <!-- MANOS (piel) -->
      <ellipse cx="44" cy="266" rx="13" ry="9" fill="#F0C090"/>
      <ellipse cx="276" cy="266" rx="13" ry="9" fill="#F0C090"/>

      <ellipse cx="196" cy="91" rx="8" ry="10" fill="#EAB890"/>

      <!-- ══ COMPLEMENTO: MANTÓN ══ -->

  <!-- ══ DERECHA: Librería de Telas ══ -->
  <aside id="telas-panel">

      <span class="tp-eyebrow">✦ Cosas Cucas</span>
      <div class="tp-title">Librería de telas</div>

    </div>
    <div class="tp-filters">
      <button class="tp-filter active" data-tipo="Todas"       onclick="filterTelas('Todas')">Todas</button>
      <button class="tp-filter"        data-tipo="Seda"        onclick="filterTelas('Seda')">Seda</button>
      <button class="tp-filter"        data-tipo="Terciopelo"  onclick="filterTelas('Terciopelo')">Terciopelo</button>
      <button class="tp-filter"        data-tipo="Tafetán"     onclick="filterTelas('Tafetán')">Tafetán</button>
      <button class="tp-filter"        data-tipo="Raso"        onclick="filterTelas('Raso')">Raso</button>

</main>

<script>
/* ══════════════════════════════════════════
   DATOS: TELAS
══════════════════════════════════════════ */
const TELAS = [
  { id:'seda-carmin',    nombre:'Seda Carmín',       tipo:'Seda',        color:'#922020' },
  { id:'seda-azul',      nombre:'Seda Azul Rey',     tipo:'Seda',        color:'#1B3A8A' },
  { id:'seda-verde',     nombre:'Seda Esmeralda',    tipo:'Seda',        color:'#1A6B3C' },
  { id:'seda-dorada',    nombre:'Seda Dorada',       tipo:'Seda',        color:'#B5903A' },
  { id:'seda-rosa',      nombre:'Seda Rosa Antiguo', tipo:'Seda',        color:'#C4858B' },
  { id:'seda-naranja',   nombre:'Seda Naranja',      tipo:'Seda',        color:'#C4631A' },
  { id:'seda-lila',      nombre:'Seda Lila',         tipo:'Seda',        color:'#9070C0' },
  { id:'seda-celeste',   nombre:'Seda Celeste',      tipo:'Seda',        color:'#4A90C8' },
  { id:'tercio-negro',   nombre:'Terciopelo Negro',  tipo:'Terciopelo',  color:'#181512' },
  { id:'tercio-granate', nombre:'Terciopelo Granate',tipo:'Terciopelo',  color:'#6B1A2A' },
  { id:'tercio-morado',  nombre:'Terciopelo Morado', tipo:'Terciopelo',  color:'#4E1A70' },
  { id:'tercio-verde',   nombre:'Terc. Botella',     tipo:'Terciopelo',  color:'#1A3E20' },
  { id:'tercio-marino',  nombre:'Terc. Marino',      tipo:'Terciopelo',  color:'#1A2A4A' },
  { id:'tercio-caoba',   nombre:'Terc. Caoba',       tipo:'Terciopelo',  color:'#5C2A10' },
  { id:'taf-perla',      nombre:'Tafetán Perla',     tipo:'Tafetán',     color:'#EEE5C8' },
  { id:'taf-celeste',    nombre:'Tafetán Celeste',   tipo:'Tafetán',     color:'#8AB8D8' },
  { id:'taf-rosa',       nombre:'Tafetán Rosa',      tipo:'Tafetán',     color:'#E8A0A8' },
  { id:'taf-amarillo',   nombre:'Tafetán Amarillo',  tipo:'Tafetán',     color:'#D4A820' },
  { id:'taf-menta',      nombre:'Tafetán Menta',     tipo:'Tafetán',     color:'#70C8A0' },
  { id:'raso-negro',     nombre:'Raso Negro',        tipo:'Raso',        color:'#1E1A18' },
  { id:'raso-burdeos',   nombre:'Raso Burdeos',      tipo:'Raso',        color:'#7D1830' },
  { id:'raso-verde',     nombre:'Raso Verde',        tipo:'Raso',        color:'#2A6040' },
  { id:'raso-azul',      nombre:'Raso Azul Noche',   tipo:'Raso',        color:'#1A2A58' },
  { id:'raso-bronce',    nombre:'Raso Bronce',       tipo:'Raso',        color:'#8A6A28' },
];

/* ══════════════════════════════════════════
   ESTADO
══════════════════════════════════════════ */
const PART_MAP = {
  falda:   { cssVar:'--c-falda',   svgId:'gFalda',   label:'Falda'   },
  corpino: { cssVar:'--c-corpino', svgId:'gCorpino', label:'Corpiño' },
  zapatos: { cssVar:'--c-zapatos', svgId:'gZapatos', label:'Zapatos' },
  flores:  { cssVar:'--c-flores',  svgId:'gFlores',  label:'Flores'  },
  manton:  { cssVar:'--c-manton',  svgId:'gManton',  label:'Mantón'  },
  aderezo: { cssVar:'--c-aderezo', svgId:'gAderezo', label:'Aderezo' },
  peineta: { cssVar:'--c-aderezo', svgId:'gPeineta', label:'Peineta' },
};

const state = {
  part: 'falda',
  filter: 'Todas',
  selections: {
    falda:   { id:'seda-azul',    color:'#1B3A8A', nombre:'Seda Azul Rey'     },
    corpino: { id:'seda-carmin',  color:'#922020', nombre:'Seda Carmín'       },
    zapatos: { id:'tercio-caoba', color:'#5C2A10', nombre:'Terciopelo Caoba'  },
    flores:  { id:'seda-rosa',    color:'#C4858B', nombre:'Seda Rosa Antiguo' },
    manton:  { id:'seda-dorada',  color:'#B5903A', nombre:'Seda Dorada'       },
    aderezo: { id:'seda-dorada',  color:'#B5903A', nombre:'Seda Dorada'       },
    peineta: { id:'seda-dorada',  color:'#B5903A', nombre:'Seda Dorada'       },
  },
  complements: { flores:false, manton:false, aderezo:false, peineta:false }
};

/* ══════════════════════════════════════════
   SELECCIONAR PARTE
══════════════════════════════════════════ */
function selectPart(part) {
  state.part = part;

  document.querySelectorAll('.part-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.part === part);
  });

  const lbl = PART_MAP[part]?.label || part;
  document.getElementById('tp-active-part').textContent = lbl;

  // Resaltar en SVG
  Object.keys(PART_MAP).forEach(p => {
    const el = document.getElementById(PART_MAP[p].svgId);
    if (el) el.classList.toggle('sel', p === part);
  });

  renderTelas();
  hideHint();
}

/* ══════════════════════════════════════════
   SELECCIONAR TELA → aplicar color
══════════════════════════════════════════ */
function selectTela(tela) {
  const part = state.part;
  state.selections[part] = { id:tela.id, color:tela.color, nombre:tela.nombre };

  const cssVar = PART_MAP[part]?.cssVar;
  if (cssVar) document.documentElement.style.setProperty(cssVar, tela.color);

  // Actualizar dot del botón de parte
  const dot = document.getElementById('dot-' + part);
  if (dot) dot.style.background = tela.color;

  renderTelas();
  updateMailto();
}

/* ══════════════════════════════════════════
   TOGGLE COMPLEMENTO
══════════════════════════════════════════ */
function toggleComplement(comp) {
  const on = !state.complements[comp];
  state.complements[comp] = on;

  const svgEl = document.getElementById(PART_MAP[comp]?.svgId);
  if (svgEl) svgEl.style.opacity = on ? '1' : '0';

  const btn = document.getElementById('comp-' + comp);
  if (btn) btn.classList.toggle('on', on);

  if (on) selectPart(comp);
  hideHint();
}

/* ══════════════════════════════════════════
   RENDER GRID DE TELAS
══════════════════════════════════════════ */
function renderTelas() {
  const grid = document.getElementById('telas-grid');
  const activeSel = state.selections[state.part];
  const lista = state.filter === 'Todas' ? TELAS : TELAS.filter(t => t.tipo === state.filter);

  grid.innerHTML = '';
  lista.forEach(t => {
    const sel = activeSel?.id === t.id;
    const card = document.createElement('div');
    card.className = 'tela-card' + (sel ? ' sel' : '');
    card.dataset.tipo = t.tipo;
    card.innerHTML = `
      <div class="tela-swatch" style="background:${t.color}">
        <div class="tela-check">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4 9l4 4 6-7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="tela-name">${t.nombre}</div>
      <div class="tela-tipo">${t.tipo}</div>`;
    card.addEventListener('click', () => selectTela(t));
    grid.appendChild(card);
  });
}

/* ══════════════════════════════════════════
   FILTRO
══════════════════════════════════════════ */
function filterTelas(tipo) {
  state.filter = tipo;
  document.querySelectorAll('.tp-filter').forEach(b => b.classList.toggle('active', b.dataset.tipo === tipo));
  renderTelas();
}

/* ══════════════════════════════════════════
   MAILTO dinámico
══════════════════════════════════════════ */
function updateMailto() {
  const s = state.selections;
  const comps = state.complements;
  const body = `Hola, me gustaría información sobre un traje con estas telas:\n\n`
    + `• Falda: ${s.falda?.nombre || '-'}\n`
    + `• Corpiño: ${s.corpino?.nombre || '-'}\n`
    + `• Zapatos: ${s.zapatos?.nombre || '-'}\n`
    + (comps.flores  ? `• Flores: ${s.flores?.nombre || '-'}\n` : '')
    + (comps.manton  ? `• Mantón: ${s.manton?.nombre || '-'}\n` : '')
    + (comps.aderezo ? `• Aderezo: ${s.aderezo?.nombre || '-'}\n` : '')
    + (comps.peineta ? `• Peineta: ${s.peineta?.nombre || '-'}\n` : '')
    + `\nQuedo a su disposición para concertar una visita.`;
  const link = document.getElementById('btn-pedir');
  if (link) link.href = `mailto:info@cosascucas.es?subject=Consulta%20diseño%20traje&body=${encodeURIComponent(body)}`;
}

/* ══════════════════════════════════════════
   DESCARGAR PNG
══════════════════════════════════════════ */
function downloadPNG() {
  const svg  = document.getElementById('model-svg');
  const cs   = getComputedStyle(document.documentElement);
  const clone = svg.cloneNode(true);

  // Inline CSS variables → valores reales
  function resolveVars(str) {
    return str.replace(/var\(--c-([^)]+)\)/g, (_, name) =>
      cs.getPropertyValue('--c-' + name).trim() || '#888'
    );
  }
  clone.querySelectorAll('[style]').forEach(el => {
    el.setAttribute('style', resolveVars(el.getAttribute('style')));
  });
  // Quitar hint si existe
  clone.querySelector && clone.querySelector('#model-hint') && clone.querySelector('#model-hint').remove();

  const data = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([data], { type:'image/svg+xml;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const img  = new Image();
  img.onload = () => {
    const W = 640, H = Math.round(640 * 720 / 320);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    c.getContext('2d').drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    c.toBlob(png => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(png);
      a.download = 'diseno-cosascucas.png';
      a.click();
    }, 'image/png');
  };
  img.src = url;
}

function hideHint() {
  const h = document.getElementById('model-hint');
  if (h) { h.style.opacity = '0'; h.style.pointerEvents = 'none'; }
}

/* ══════════════════════════════════════════
   INICIO
══════════════════════════════════════════ */
// Aplicar colores iniciales desde state
Object.keys(state.selections).forEach(part => {
  const cssVar = PART_MAP[part]?.cssVar;
  if (cssVar) document.documentElement.style.setProperty(cssVar, state.selections[part].color);
  const dot = document.getElementById('dot-' + part);
  if (dot) dot.style.background = state.selections[part].color;
});

renderTelas();
updateMailto();

// Ocultar hint tras 6s
setTimeout(hideHint, 6000);
</script>
</body>
