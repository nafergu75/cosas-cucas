<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Galería — Cosas Cucas. Falleras Mayores, Cortes de Honor e indumentaria valenciana artesanal desde 1982." />
  <title>Galería · Cosas Cucas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg:        #F4EDD8;
      --color-bg-alt:    #EDE5CE;
      --color-bg-dark:   #1A1714;
      --color-gold:      #B5903A;
      --color-gold-light:#D4B166;
      --color-text:      #1A1714;
      --color-text-muted:#6B5D4F;
      --color-border:    #D9CEB4;
      --color-white:     #FDFAF3;
      --font-body:       'Space Grotesk', sans-serif;
      --font-display:    'Playfair Display', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
    }

    /* ── CABECERA ── */
    .g-header {
      background: var(--color-bg-dark);
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .g-header__logo {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--color-gold);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .g-header__back {
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .g-header__back:hover { color: var(--color-gold); }
    .g-header__back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── HERO ── */
    .g-hero {
      background: var(--color-bg-dark);
      padding: 60px 40px 56px;
      text-align: center;
    }
    .g-hero__eyebrow {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-gold); margin-bottom: 14px;
    }
    .g-hero__title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--color-white);
      font-weight: 400; line-height: 1.15;
      margin-bottom: 16px;
    }
    .g-hero__sub {
      color: rgba(253,250,243,0.5);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }

    /* ── FILTROS ── */
    .g-filters {
      display: flex; justify-content: center; gap: 8px;
      padding: 32px 40px 0;
      flex-wrap: wrap;
    }
    .g-filter-btn {
      padding: 8px 20px;
      border: 1.5px solid var(--color-border);
      background: transparent;
      color: var(--color-text-muted);
      font-family: var(--font-body);
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
    }
    .g-filter-btn:hover,
    .g-filter-btn.active {
      background: var(--color-bg-dark);
      border-color: var(--color-bg-dark);
      color: var(--color-white);
    }

    /* ── GRID ── */
    .g-section {
      padding: 40px 40px 80px;
    }
    .g-section-title {
      font-family: var(--font-display);
      font-size: 1.1rem; font-weight: 400;
      color: var(--color-text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
    }
    .g-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .g-cell {
      position: relative; overflow: hidden;
      aspect-ratio: 3/4; cursor: pointer;
      background: var(--color-bg-alt);
    }
    .g-cell img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      transition: transform 0.55s ease;
      display: block;
    }
    .g-cell:hover img { transform: scale(1.06); }
    .g-cell__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(26,23,20,0.82) 0%, transparent 60%);
      display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-start;
      padding: 20px 16px;
      opacity: 0; transition: opacity 0.3s;
    }
    .g-cell:hover .g-cell__overlay { opacity: 1; }
    .g-cell__zoom {
      width: 38px; height: 38px;
      border: 1.5px solid rgba(253,250,243,0.65); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .g-cell__zoom svg { width: 15px; height: 15px; stroke: white; fill: none; stroke-width: 1.5; }
    .g-cell__caption {
      color: var(--color-white); font-size: 0.68rem;
      font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.4;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(10,8,6,0.97);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    .lightbox.open { display: flex; }
    .lightbox__img {
      max-width: min(90vw, 1100px); max-height: 88vh;
      object-fit: contain; display: block;
    }
    .lightbox__close {
      position: absolute; top: 20px; right: 24px;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.12); border: none; border-radius: 50%;
      color: white; font-size: 1.4rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 0.2s;
    }
    .lightbox__close:hover { background: rgba(255,255,255,0.22); }
    .lightbox__nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px;
      background: rgba(255,255,255,0.12); border: none; border-radius: 50%;
      color: white; font-size: 1.6rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 0.2s;
    }
    .lightbox__nav:hover { background: rgba(255,255,255,0.22); }
    .lightbox__prev { left: 20px; }
    .lightbox__next { right: 20px; }
    .lightbox__caption {
      position: absolute; bottom: 24px; left: 0; right: 0;
      text-align: center; color: rgba(253,250,243,0.55);
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .lightbox__counter {
      position: absolute; top: 24px; left: 24px;
      color: rgba(255,255,255,0.35); font-size: 0.7rem; letter-spacing: 0.08em;
    }

    /* ── FOOTER ── */
    .g-footer {
      background: var(--color-bg-dark);
      padding: 28px 40px;
      text-align: center;
      color: rgba(253,250,243,0.35);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }
    .g-footer a { color: var(--color-gold); text-decoration: none; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .g-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .g-header { padding: 18px 20px; }
      .g-hero   { padding: 40px 20px 36px; }
      .g-section { padding: 28px 16px 60px; }
      .g-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .g-filters { padding: 24px 16px 0; }
    }
    @media (max-width: 480px) {
      .g-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- CABECERA -->
<header class="g-header">
  <a href="index.html" class="g-header__logo">Cosas Cucas</a>
  <a href="index.html" class="g-header__back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Volver
  </a>
</header>

<!-- HERO -->
<div class="g-hero">
  <p class="g-hero__eyebrow">Nuestro Trabajo</p>
  <h1 class="g-hero__title">Galería</h1>
  <p class="g-hero__sub">Falleras Mayores, Cortes de Honor e indumentaria valenciana artesanal desde 1982</p>
</div>

<!-- SECCIÓN: PASARELA -->
<section class="g-section" id="sec-pasarela">
  <p class="g-section-title">Pasarela · Colección 2027</p>
  <div class="g-grid" id="grid-pasarela"></div>
</section>

<!-- SECCIÓN: INSTAGRAM (se añade cuando se descarguen las fotos) -->
<section class="g-section" id="sec-instagram" style="display:none;">
  <p class="g-section-title">Instagram · @cosascucas</p>
  <div class="g-grid" id="grid-instagram"></div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox__close" id="lb-close" aria-label="Cerrar">&times;</button>
  <button class="lightbox__nav lightbox__prev" id="lb-prev" aria-label="Anterior">&#8249;</button>
  <img class="lightbox__img" id="lb-img" src="" alt="" />
  <button class="lightbox__nav lightbox__next" id="lb-next" aria-label="Siguiente">&#8250;</button>
  <p class="lightbox__caption" id="lb-caption"></p>
  <p class="lightbox__counter" id="lb-counter"></p>
</div>

<!-- FOOTER -->
<footer class="g-footer">
  <p>© 2025 <a href="index.html">Cosas Cucas</a> · Grabador Esteve 30, Valencia · <a href="mailto:info@cosascucas.es">info@cosascucas.es</a></p>
</footer>

<script>
  const PASARELA = [
    { img: 'pasarela/_ADL4063.jpg',  caption: 'Pasarela Cosas Cucas · Falles 2027' },
    { img: 'pasarela/_ADL4065.jpg',  caption: 'Indumentaria valenciana completa' },
    { img: 'pasarela/_ADL4068.jpg',  caption: 'Detalle de bordado artesanal' },
    { img: 'pasarela/_ADL4069.jpg',  caption: 'Seda valenciana exclusiva' },
    { img: 'pasarela/_ADL4071.jpg',  caption: 'Manteleta bordada a mano' },
    { img: 'pasarela/_ADL4076.jpg',  caption: 'Elegancia tradicional valenciana' },
    { img: 'pasarela/_ADL4077.jpg',  caption: 'Colección Falles 2027' },
    { img: 'pasarela/_ADL4080.jpg',  caption: 'Cotilla artesanal a medida' },
    { img: 'pasarela/_ADL4081.jpg',  caption: 'Pasarela — confección exclusiva' },
    { img: 'pasarela/_ADL4083.jpg',  caption: 'Aderezo y complementos de gala' },
    { img: 'pasarela/_ADL4087.jpg',  caption: 'Indumentaria de Fallera Mayor' },
    { img: 'pasarela/_ADL4091.jpg',  caption: 'Telas de seda valenciana' },
    { img: 'pasarela/_ADL4093.jpg',  caption: 'Bordados en hilo de oro' },
    { img: 'pasarela/_ADL4095.jpg',  caption: 'Falda y delantal siglo XVIII' },
    { img: 'pasarela/_ADL4097.jpg',  caption: 'Pañuelo de cuello bordado' },
    { img: 'pasarela/_ADL4101.jpg',  caption: 'Confección artesanal Cosas Cucas' },
    { img: 'pasarela/_ADL4111.jpg',  caption: 'Pasarela — diseño exclusivo' },
    { img: 'pasarela/_ADL4169.jpg',  caption: 'La tradición valenciana en todo su esplendor' },
  ];

  /* Las fotos de Instagram se añaden aquí cuando se descarguen en /fotos */
  const INSTAGRAM = [
    /* Ejemplo: { img: 'fotos/foto1.jpg', caption: 'Fallera Mayor · Cosas Cucas' }, */
  ];

  /* ── Lightbox ── */
  let allItems = [];
  let lbIdx = 0;

  function openLb(items, idx) {
    allItems = items;
    lbIdx = idx;
    renderLb();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function renderLb() {
    const it = allItems[lbIdx];
    document.getElementById('lb-img').src     = it.img;
    document.getElementById('lb-img').alt     = it.caption;
    document.getElementById('lb-caption').textContent = it.caption;
    document.getElementById('lb-counter').textContent = (lbIdx + 1) + ' / ' + allItems.length;
  }
  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function navLb(dir) {
    lbIdx = (lbIdx + dir + allItems.length) % allItems.length;
    renderLb();
  }
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', () => navLb(-1));
  document.getElementById('lb-next').addEventListener('click', () => navLb(1));
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLb();
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape')      closeLb();
    if (e.key === 'ArrowLeft')   navLb(-1);
    if (e.key === 'ArrowRight')  navLb(1);
  });

  /* ── Render grid ── */
  function renderGrid(containerId, items) {
    const el = document.getElementById(containerId);
    el.innerHTML = items.map((it, i) => `
      <div class="g-cell" data-idx="${i}" tabindex="0" role="button" aria-label="${it.caption}">
        <img src="${it.img}" alt="${it.caption}" loading="lazy" />
        <div class="g-cell__overlay">
          <div class="g-cell__zoom">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </div>
          <span class="g-cell__caption">${it.caption}</span>
        </div>
      </div>`).join('');
    el.addEventListener('click', e => {
      const cell = e.target.closest('.g-cell');
      if (cell) openLb(items, +cell.dataset.idx);
    });
  }

  /* ── Init ── */
  renderGrid('grid-pasarela', PASARELA);
  if (INSTAGRAM.length > 0) {
    document.getElementById('sec-instagram').style.display = '';
    renderGrid('grid-instagram', INSTAGRAM);
  }
</script>
</body>
</html>
