<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Galería — Cosas Cucas. Falleras Mayores, Cortes de Honor e indumentaria valenciana artesanal desde 1982." />
  <title>Galería · Cosas Cucas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg:        #F4EDD8;
      --color-bg-alt:    #EDE5CE;
      --color-bg-dark:   #1A1714;
      --color-gold:      #B5903A;
      --color-gold-light:#D4B166;
      --color-text:      #1A1714;
      --color-text-muted:#6B5D4F;
      --color-border:    #D9CEB4;
      --color-white:     #FDFAF3;
      --font-body:       'Space Grotesk', sans-serif;
      --font-display:    'Playfair Display', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
    }

    /* ── CABECERA ── */
    .g-header {
      background: var(--color-bg-dark);
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .g-header__logo {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--color-gold);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .g-header__back {
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .g-header__back:hover { color: var(--color-gold); }
    .g-header__back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── HERO ── */
    .g-hero {
      background: var(--color-bg-dark);
      padding: 60px 40px 56px;
      text-align: center;
    }
    .g-hero__eyebrow {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-gold); margin-bottom: 14px;
    }
    .g-hero__title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--color-white);
      font-weight: 400; line-height: 1.15;
      margin-bottom: 16px;
    }
    .g-hero__sub {
      color: rgba(253,250,243,0.5);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }

    /* ── FILTROS ── */
    .g-filters {
      display: flex; justify-content: center; gap: 8px;
      padding: 32px 40px 0;
      flex-wrap: wrap;
    }
    .g-filter-btn {
      padding: 8px 20px;
      border: 1.5px solid var(--color-border);
      background: transparent;
      color: var(--color-text-muted);
      font-family: var(--font-body);
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
    }
    .g-filter-btn:hover,
    .g-filter-btn.active {
      background: var(--color-bg-dark);
      border-color: var(--color-bg-dark);
      color: var(--color-white);
    }

    /* ── GRID ── */
    .g-section {
      padding: 40px 40px 80px;
    }
    .g-section-title {
      font-family: var(--font-display);
      font-size: 1.1rem; font-weight: 400;
      color: var(--color-text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
    }
    .g-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .g-cell {
      position: relative; overflow: hidden;
      aspect-ratio: 3/4; cursor: pointer;
      background: var(--color-bg-alt);
    }
    .g-cell img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      transition: transform 0.55s ease;
      display: block;
    }
    .g-cell:hover img { transform: scale(1.06); }
    .g-cell__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(26,23,20,0.82) 0%, transparent 60%);
      display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-start;
      padding: 20px 16px;
      opacity: 0; transition: opacity 0.3s;
    }
    .g-cell:hover .g-cell__overlay { opacity: 1; }
    .g-cell__zoom {
      width: 38px; height: 38px;
      border: 1.5px solid rgba(253,250,243,0.65); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .g-cell__zoom svg { width: 15px; height: 15px; stroke: white; fill: none; stroke-width: 1.5; }
    .g-cell__caption {
      color: var(--color-white); font-size: 0.68rem;
      font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.4;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(10,8,6,0.97);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    .lightbox.open { display: flex; }
    .lightbox__img {
      max-width: min(90vw, 1100px); max-height: 88vh;
      object-fit: contain; display: block;
    }
    .lightbox__close {
      position: absolute; top: 20px; right: 24px;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.12); border: none; border-radius: 50%;
      color: white; font-size: 1.4rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 0.2s;
    }
    .lightbox__close:hover { background: rgba(255,255,255,0.22); }
    .lightbox__nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px;
      background: rgba(255,255,255,0.12); border: none; border-radius: 50%;
      color: white; font-size: 1.6rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 0.2s;
    }
    .lightbox__nav:hover { background: rgba(255,255,255,0.22); }
    .lightbox__prev { left: 20px; }
    .lightbox__next { right: 20px; }
    .lightbox__caption {
      position: absolute; bottom: 24px; left: 0; right: 0;
      text-align: center; color: rgba(253,250,243,0.55);
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .lightbox__counter {
      position: absolute; top: 24px; left: 24px;
      color: rgba(255,255,255,0.35); font-size: 0.7rem; letter-spacing: 0.08em;
    }

    /* ── FOOTER ── */
    .g-footer {
      background: var(--color-bg-dark);
      padding: 28px 40px;
      text-align: center;
      color: rgba(253,250,243,0.35);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }
    .g-footer a { color: var(--color-gold); text-decoration: none; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .g-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .g-header { padding: 18px 20px; }
      .g-hero   { padding: 40px 20px 36px; }
      .g-section { padding: 28px 16px 60px; }
      .g-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .g-filters { padding: 24px 16px 0; }
    }
    @media (max-width: 480px) {
      .g-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Ajustes iPhone: fotos completas en lightbox y controles fuera de la imagen. */
    @media (max-width: 768px) {
      body {
        overflow-x: hidden;
      }

      .g-header {
        padding-left: 16px;
        padding-right: 16px;
      }

      .g-hero {
        padding: 36px 18px 30px;
      }

      .g-section {
        padding: 26px 12px 54px;
      }

      .g-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .g-cell {
        aspect-ratio: 3 / 4;
      }

      .g-cell img {
        object-position: center top;
      }

      .g-cell__overlay {
        opacity: 1;
        padding: 34px 10px 10px;
      }

      .g-cell__zoom {
        width: 34px;
        height: 34px;
      }

      .g-cell__caption {
        font-size: 0.62rem;
        letter-spacing: 0.08em;
      }

      .lightbox {
        min-height: 100vh;
        min-height: 100dvh;
        padding: calc(env(safe-area-inset-top) + 64px) 12px calc(env(safe-area-inset-bottom) + 72px);
      }

      .lightbox__img {
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: calc(100dvh - 160px);
        object-fit: contain;
      }

      .lightbox__close {
        top: calc(env(safe-area-inset-top) + 12px);
        right: 14px;
        width: 42px;
        height: 42px;
        z-index: 2;
      }

      .lightbox__counter {
        top: calc(env(safe-area-inset-top) + 24px);
        left: 16px;
      }

      .lightbox__caption {
        bottom: calc(env(safe-area-inset-bottom) + 18px);
        padding: 0 58px;
        line-height: 1.45;
      }

      .lightbox__nav {
        top: auto;
        bottom: calc(env(safe-area-inset-bottom) + 14px);
        transform: none;
        width: 44px;
        height: 44px;
        z-index: 2;
      }

      .lightbox__prev {
        left: 14px;
      }

      .lightbox__next {
        right: 14px;
      }
    }

    @media (max-width: 380px) {
      .g-section {
        padding-left: 10px;
        padding-right: 10px;
      }

      .g-grid {
        gap: 8px;
      }

      .g-cell__caption {
        display: none;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       CLIPPED GOEY GALLERY — traducción del componente React
       Las fotos se recortan con formas SVG; al hacer hover el padding
       se reduce y la imagen escala → efecto "reventar el marco"
    ═══════════════════════════════════════════════════════════════════════ */
    /* SVG de definiciones oculto */
    .goey-svg {
      position: absolute; top: -9999px; left: -9999px;
      width: 0; height: 0; overflow: hidden;
    }

    /* Grid de 3 columnas */
    .goey-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 24px;
    }

    /* Figura con degradado y padding que se encoge en hover */
    .goey-figure {
      padding: 28px;               /* equiv. Tailwind p-7 */
      border-radius: 14px;
      cursor: pointer;
      transition: padding 0.22s ease, box-shadow 0.22s ease;
      position: relative;
    }
    .goey-figure:hover {
      padding: 12px;               /* "destapa" más imagen */
      box-shadow: 0 12px 40px rgba(0,0,0,0.28);
    }

    /* Contenedor del clip-path */
    .goey-clip {
      overflow: visible;           /* el clip-path se encarga de recortar */
    }

    /* Imagen dentro del clip: cuadrada, escala al hacer hover */
    .goey-img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.3s ease;
      vertical-align: bottom;
    }
    .goey-figure:hover .goey-img {
      transform: scale(1.12);      /* zoom suave al pasar el ratón */
    }

    /* 6 variantes de degradado — paleta cálida valenciana */
    .goey-grad-1 { background: linear-gradient(to bottom, #c9ad66, #9b6e18); }  /* oro */
    .goey-grad-2 { background: linear-gradient(to top,    #8c8a57, #5a5e3a); }  /* oliva */
    .goey-grad-3 { background: linear-gradient(to top,    #c24445, #e07060); }  /* rojo coral */
    .goey-grad-4 { background: linear-gradient(to top,    #a03010, #f0c850); }  /* naranja-dorado */
    .goey-grad-5 { background: linear-gradient(to bottom, #133050, #2e6070); }  /* azul profundo */
    .goey-grad-6 { background: linear-gradient(to bottom, #324644, #708a78); }  /* verde pizarra */

    /* Responsive */
    @media (max-width: 900px) {
      .goey-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .goey-figure { padding: 20px; }
      .goey-figure:hover { padding: 10px; }
    }
    @media (max-width: 600px) {
      .goey-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .goey-figure { padding: 16px; }
      .goey-figure:hover { padding: 8px; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       FLIP REVEAL — filtros de categoría (traducción de flip-reveal.tsx)
    ═══════════════════════════════════════════════════════════════════════ */

    /* Oculta items fuera de la categoría activa (equivale a hideClass="hidden") */
    .flip-hide { display: none !important; }

    /* Durante la animación GSAP Flip se deshabilitan las transiciones de hover */
    .g-grid.is-flipping .g-cell img,
    .g-grid.is-flipping .g-cell__overlay { transition: none; }

    /* Grupo de botones de filtro — replica el ToggleGroup de shadcn */
    .flip-filters {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 4px 0 28px;
      flex-wrap: wrap;
    }
    .flip-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 20px;
      border: 1.5px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text-muted);
      font-family: var(--font-body);
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .flip-btn:hover {
      border-color: var(--color-text);
      color: var(--color-text);
      transform: translateY(-1px);
    }
    /* Estado activo = ToggleGroupItem [data-state=on] */
    .flip-btn.active {
      background: var(--color-bg-dark);
      border-color: var(--color-bg-dark);
      color: var(--color-white);
    }
    .flip-btn.active:hover { transform: none; }

    /* Icono de categoría dentro del botón */
    .flip-btn svg {
      width: 15px; height: 15px;
      stroke: currentColor; fill: none; stroke-width: 1.8;
      flex-shrink: 0;
    }

    /* Contador de ítems por categoría */
    .flip-btn__count {
      display: inline-flex;
      align-items: center; justify-content: center;
      min-width: 18px; height: 18px;
      padding: 0 4px;
      border-radius: 9px;
      background: rgba(181,144,58,0.18);
      color: var(--color-gold);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0;
      transition: background 0.2s, color 0.2s;
    }
    .flip-btn.active .flip-btn__count {
      background: rgba(181,144,58,0.35);
      color: var(--color-gold-light);
    }

    @media (max-width: 600px) {
      .flip-filters { gap: 5px; }
      .flip-btn { padding: 8px 14px; font-size: 0.68rem; gap: 5px; }
      .flip-btn__count { display: none; }
    }
  </style>
</head>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">

</div>

<!-- GSAP + Flip plugin (MIT) — FlipReveal gallery filters -->

  /* ── Shapes y degradados para ClippedGoeyGallery ── */
  const GOEY_CLIPS  = ['clip-goey1','clip-goey2','clip-goey3','clip-goey4','clip-goey5','clip-goey6'];
  const GOEY_GRADS  = ['goey-grad-1','goey-grad-2','goey-grad-3','goey-grad-4','goey-grad-5','goey-grad-6'];

  /* ── Lightbox ── */
  let allItems = [];
  let lbIdx = 0;

  function openLb(items, idx) {
    allItems = items;
    lbIdx = idx;
    renderLb();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function renderLb() {
    const it = allItems[lbIdx];
    document.getElementById('lb-img').src     = it.img;
    document.getElementById('lb-img').alt     = it.caption;
    document.getElementById('lb-caption').textContent = it.caption;
    document.getElementById('lb-counter').textContent = (lbIdx + 1) + ' / ' + allItems.length;
  }
  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function navLb(dir) {
    lbIdx = (lbIdx + dir + allItems.length) % allItems.length;
    renderLb();
  }
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', () => navLb(-1));
  document.getElementById('lb-next').addEventListener('click', () => navLb(1));
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLb();
  });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape')      closeLb();
    if (e.key === 'ArrowLeft')   navLb(-1);
    if (e.key === 'ArrowRight')  navLb(1);
  });

  /* ── Render galería de tienda: fotos limpias sin efectos ──
     Usa el mismo .g-cell que la sección de pasarela.
     Añade data-flip="${it.cat}" para que GSAP Flip pueda filtrar.
  ── */
  function renderGoeyGrid(containerId, items) {
    const el = document.getElementById(containerId);
    if (!el) return;

    el.innerHTML = items.map((it, i) => {
      const src = it.img.replace(/ /g, '%20');
      return `<div class="g-cell"
            data-idx="${i}"
            data-flip="${it.cat}"
            tabindex="0" role="button"
            aria-label="${it.caption}">
        <img src="${src}" alt="${it.caption}" loading="lazy" />
        <div class="g-cell__overlay">
          <div class="g-cell__zoom">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"/>
              <line x1="16.5" y1="16.5" x2="22" y2="22"/>
              <line x1="11" y1="8"   x2="11" y2="14"/>
              <line x1="8"  y1="11"  x2="14" y2="11"/>
            </svg>
          </div>
          <span class="g-cell__caption">${it.caption}</span>
        </div>
      </div>`;
    }).join('');

    /* Click / tecla → lightbox */
    el.addEventListener('click', e => {
      const cell = e.target.closest('.g-cell');
      if (cell) openLb(items, +cell.dataset.idx);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        const cell = e.target.closest('.g-cell');
        if (cell) { e.preventDefault(); openLb(items, +cell.dataset.idx); }
      }
    });
  }

  /* ── Render grid (cuadrícula clásica) ── */
  function renderGrid(containerId, items) {
    const el = document.getElementById(containerId);
    el.innerHTML = items.map((it, i) => `
      <div class="g-cell" data-idx="${i}" tabindex="0" role="button" aria-label="${it.caption}">
        <img src="${it.img}" alt="${it.caption}" loading="lazy" />
        <div class="g-cell__overlay">
          <div class="g-cell__zoom">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
          </div>
          <span class="g-cell__caption">${it.caption}</span>
        </div>
      </div>`).join('');
    el.addEventListener('click', e => {
      const cell = e.target.closest('.g-cell');
      if (cell) openLb(items, +cell.dataset.idx);
    });
  }

  /* ═══════════════════════════════════════════════════════════════════════
     FLIP REVEAL — traducción exacta de flip-reveal.tsx usando GSAP Flip
     ─────────────────────────────────────────────────────────────────────
     • Equivale a <FlipReveal keys={[cat]} showClass="" hideClass="flip-hide">
     • Captura estado ANTES del cambio de clases (Flip.getState)
     • Anima de la posición anterior a la nueva (Flip.from)
     • onEnter: fadeIn + scale desde 0  — onLeave: fadeOut + scale a 0
  ═══════════════════════════════════════════════════════════════════════ */
  function initFlipReveal() {
    const wrapper = document.getElementById('grid-galeria');
    if (!wrapper) return;

    /* Contar ítems por categoría y actualizar badges */
    const counts = { all: 0, mujer: 0, hombre: 0, nino: 0 };
    wrapper.querySelectorAll('[data-flip]').forEach(el => {
      const k = el.getAttribute('data-flip');
      if (counts[k] !== undefined) counts[k]++;
      counts.all++;
    });
    ['all','mujer','hombre','nino'].forEach(k => {
      const badge = document.getElementById('cnt-' + k);
      if (badge) badge.textContent = counts[k];
    });

    /* Si GSAP no está disponible → solo muestra/oculta sin animación */
    const hasGsap = typeof gsap !== 'undefined' && typeof Flip !== 'undefined';
    if (hasGsap) gsap.registerPlugin(Flip);

    function applyFilter(cat) {
      const items = wrapper.querySelectorAll('[data-flip]');

      if (!hasGsap) {
        /* Fallback sin animación */
        items.forEach(el => {
          const key = el.getAttribute('data-flip');
          el.classList.toggle('flip-hide', cat !== 'all' && key !== cat);
        });
        return;
      }

      /* ── GSAP Flip: misma lógica que useGSAP() en flip-reveal.tsx ── */
      const state = Flip.getState(items);          /* 1. capturar posiciones actuales */

      wrapper.classList.add('is-flipping');        /* deshabilitar hover-transitions */

      items.forEach(el => {                        /* 2. cambiar clases (show/hide) */
        const key = el.getAttribute('data-flip');
        const show = cat === 'all' || key === cat;
        el.classList.toggle('flip-hide', !show);
      });

      Flip.from(state, {                           /* 3. animar desde las posiciones anteriores */
        duration : 0.6,
        scale    : true,
        ease     : 'power1.inOut',
        stagger  : 0.05,
        absolute : true,
        onEnter  : els => gsap.fromTo(els,
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.8 }
        ),
        onLeave    : els => gsap.to(els, { opacity: 0, scale: 0, duration: 0.8 }),
        onComplete : ()  => wrapper.classList.remove('is-flipping'),
      });
    }

    /* ── Eventos de los botones de filtro ── */
    document.querySelectorAll('.flip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        document.querySelectorAll('.flip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(cat);
      });
    });
  }

  /* ── Init ── */
  renderGrid('grid-pasarela', PASARELA);

  /* FlipReveal — inicializar filtros por categoría */
  initFlipReveal();
